<div class="w-80 h-full bg-muted/20 border-l border-border flex flex-col transition-all duration-300"
     [class.translate-x-0]="isOpen()"
     [class.translate-x-full]="!isOpen()"
     [class.absolute]="!isOpen()"
     [class.right-0]="!isOpen()">
  
  <div class="p-4 border-b border-border flex items-center justify-between">
    <h3 class="font-semibold text-foreground flex items-center gap-2">
      <lucide-angular [img]="MessageSquareIcon" class="w-4 h-4"></lucide-angular>
      Comments
    </h3>
    <button (click)="toggleComments()" class="text-muted-foreground hover:text-foreground">
      <lucide-angular [img]="XIcon" class="w-4 h-4"></lucide-angular>
    </button>
  </div>

  <div class="flex-1 overflow-y-auto p-4 space-y-4">
    <div *ngIf="comments().length === 0" class="text-center text-sm text-muted-foreground mt-8">
      No comments yet. Select text to add a comment.
    </div>

    <div *ngFor="let comment of comments()" class="bg-card border border-border rounded-lg p-3 shadow-sm relative group">
      <div class="flex items-center gap-2 mb-2">
        <div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center text-[10px] text-primary-foreground font-bold">
          {{ comment.userId.substring(0,2) | uppercase }}
        </div>
        <span class="text-xs font-medium text-foreground">User {{ comment.userId.substring(0,4) }}</span>
        <span class="text-[10px] text-muted-foreground ml-auto">{{ comment.createdAt | date:'short' }}</span>
      </div>
      <p class="text-sm text-foreground/90">{{ comment.content }}</p>
      
      <div class="mt-3 flex justify-end opacity-0 group-hover:opacity-100 transition-opacity">
        <button *ngIf="!comment.resolved" (click)="resolve(comment.id)" class="text-xs flex items-center gap-1 text-green-600 hover:text-green-700 font-medium">
          <lucide-angular [img]="CheckIcon" class="w-3 h-3"></lucide-angular>
          Resolve
        </button>
        <span *ngIf="comment.resolved" class="text-xs flex items-center gap-1 text-muted-foreground">
          <lucide-angular [img]="CheckIcon" class="w-3 h-3"></lucide-angular>
          Resolved
        </span>
      </div>
    </div>
  </div>

  <div class="p-4 border-t border-border bg-background">
    <form (ngSubmit)="addComment()" class="flex flex-col gap-2">
      <textarea 
        [(ngModel)]="newCommentText"
        name="comment"
        class="w-full text-sm bg-muted/50 border border-border rounded-md p-2 focus:outline-none focus:border-primary resize-none h-20"
        placeholder="Add a general comment..."></textarea>
      <div class="flex justify-end">
        <button type="submit" [disabled]="!newCommentText.trim()" class="px-3 py-1.5 bg-primary text-primary-foreground text-sm font-medium rounded-md disabled:opacity-50 hover:bg-primary/90 transition-colors">
          Comment
        </button>
      </div>
    </form>
  </div>
</div>
