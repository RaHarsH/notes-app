<div class="min-h-screen flex items-center justify-center bg-background py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-card p-8 rounded-xl shadow-lg border border-border">
    <div>
      <h2 class="mt-6 text-center text-3xl font-extrabold text-foreground">
        Sign in to your account
      </h2>
    </div>
    
    <div *ngIf="error()" class="bg-red-500/10 border border-red-500/50 text-red-600 p-3 rounded-md text-sm">
      {{ error() }}
    </div>

    <form class="mt-8 space-y-6" (ngSubmit)="onSubmit()">
      <div class="rounded-md shadow-sm -space-y-px">
        <div class="mb-4">
          <label for="email-address" class="sr-only">Email address</label>
          <input id="email-address" name="email" type="email" [(ngModel)]="email" required class="appearance-none rounded-md relative block w-full px-3 py-2 border border-border bg-background text-foreground placeholder-muted-foreground focus:outline-none focus:ring-primary focus:border-primary sm:text-sm" placeholder="Email address">
        </div>
        <div class="relative">
          <label for="password" class="sr-only">Password</label>
          <input id="password" name="password" [type]="showPassword() ? 'text' : 'password'" [(ngModel)]="password" required class="appearance-none rounded-md relative block w-full px-3 py-2 border border-border bg-background text-foreground placeholder-muted-foreground focus:outline-none focus:ring-primary focus:border-primary sm:text-sm pr-10" placeholder="Password">
          <button type="button" (click)="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-muted-foreground hover:text-foreground transition-colors" tabindex="-1">
            <lucide-angular *ngIf="!showPassword()" [img]="EyeIcon" class="w-4 h-4"></lucide-angular>
            <lucide-angular *ngIf="showPassword()" [img]="EyeOffIcon" class="w-4 h-4"></lucide-angular>
          </button>
        </div>
      </div>

      <div>
        <button type="submit" [disabled]="loading()" class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-primary-foreground bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors disabled:opacity-50">
          <span *ngIf="!loading()">Sign in</span>
          <span *ngIf="loading()">Signing in...</span>
        </button>
      </div>
    </form>

    <div class="text-center text-sm">
      <p class="text-muted-foreground">
        Don't have an account? 
        <a routerLink="/signup" class="font-medium text-primary hover:text-primary/80 transition-colors">Sign up</a>
      </p>
    </div>
  </div>
</div>
