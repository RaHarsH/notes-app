# ─────────────────────────────────────────────────────────────────
# Collab Notes — Root Docker Compose
# Run: docker compose up --build
# ─────────────────────────────────────────────────────────────────

networks:
  collab-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  nats_data:

services:

  # ════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ════════════════════════════════════════════════════════════════

  postgres:
    image: postgres:16-alpine
    container_name: collab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_USER}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - collab-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: collab_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - collab-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: collab_nats
    restart: unless-stopped
    command: ["-js", "--store_dir=/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - collab-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  nginx:
    image: nginx:alpine
    container_name: collab_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - collab-net

  # ════════════════════════════════════════════════════════════════
  # APPLICATION SERVICES
  # ════════════════════════════════════════════════════════════════

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: collab_api_gateway
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${API_GATEWAY_PORT}
      NATS_URL: ${NATS_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      NODE_ENV: ${NODE_ENV}
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - collab-net

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: collab_auth_service
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${AUTH_DATABASE_URL}
      NATS_URL: ${NATS_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      NODE_ENV: ${NODE_ENV}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - collab-net

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: collab_user_service
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${USER_DATABASE_URL}
      NATS_URL: ${NATS_URL}
      NODE_ENV: ${NODE_ENV}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - collab-net

  notes-service:
    build:
      context: ./services/notes-service
      dockerfile: Dockerfile
    container_name: collab_notes_service
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${NOTES_DATABASE_URL}
      NATS_URL: ${NATS_URL}
      NODE_ENV: ${NODE_ENV}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - collab-net

  collaboration-service:
    build:
      context: ./services/collaboration-service
      dockerfile: Dockerfile
    container_name: collab_collab_service
    restart: unless-stopped
    env_file: .env
    environment:
      NATS_URL: ${NATS_URL}
      REDIS_URL: ${REDIS_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      COLLAB_SERVICE_PORT: ${COLLAB_SERVICE_PORT}
      NODE_ENV: ${NODE_ENV}
    ports:
      - "${COLLAB_SERVICE_PORT}:${COLLAB_SERVICE_PORT}"
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - collab-net

  history-service:
    build:
      context: ./services/history-service
      dockerfile: Dockerfile
    container_name: collab_history_service
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${HISTORY_DATABASE_URL}
      NATS_URL: ${NATS_URL}
      NODE_ENV: ${NODE_ENV}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - collab-net

  comment-service:
    build:
      context: ./services/comment-service
      dockerfile: Dockerfile
    container_name: collab_comment_service
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${COMMENTS_DATABASE_URL}
      NATS_URL: ${NATS_URL}
      NODE_ENV: ${NODE_ENV}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - collab-net

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: collab_notification_service
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${NOTIFICATIONS_DATABASE_URL}
      NATS_URL: ${NATS_URL}
      NODE_ENV: ${NODE_ENV}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - collab-net
